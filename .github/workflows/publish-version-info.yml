name: Publish NPM Version Info

on:
  release:
    types: [published]

jobs:
  dispatch:
    if: github.repository == 'lyswhut/lx-music-desktop'
    runs-on: ubuntu-latest
    env:
      PAT: ${{ secrets.PAT }}
    steps:
      - name: Repository Dispatch
        if: env.PAT != ''
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.PAT }}
          repository: lyswhut/lx-music-desktop-version-info
          event-type: npm-release
      - name: Skip dispatch when PAT is missing
        if: env.PAT == ''
        run: echo "PAT is not configured, skipping repository dispatch."
