[package]
name = "lx-native-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
filetime = "0.2"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["avif", "gif", "jpeg", "png", "webp"] }
lofty = "0.24"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.53", features = ["fs", "macros", "net", "process", "rt-multi-thread", "sync", "time", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
uuid = { version = "1.18", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = "symbols"
